import androidx.build.KotlinTarget
import androidx.build.SoftwareType
import androidx.build.PlatformIdentifier

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("JetBrainsAndroidXPlugin")
}

androidXMultiplatform {
    js()
    wasmJs()

    defaultPlatform(PlatformIdentifier.WASM_JS)

    sourceSets {
        webMain.dependencies {
            api(project(":compose:ui:ui-graphics"))
            api(project(":compose:ui:ui-text"))
            implementation(project(":compose:runtime:runtime"))
            implementation(project(":compose:ui:ui-util"))
            // To comply with Klib resolver until https://youtrack.jetbrains.com/issue/KT-61096 is fixed
            implementation("org.jetbrains.compose.collection-internal:collection:1.10.0")
        }

        webTest.dependencies {
            implementation(libs.kotlinTest)
        }

        configureEach {
            // The whole module is an interop layer over the browser APIs.
            languageSettings.optIn("kotlin.js.ExperimentalWasmJsInterop")
        }
    }
}

androidx {
    name = "Compose UI Web Canvas"
    type = SoftwareType.PUBLISHED_LIBRARY_ONLY_USED_BY_KOTLIN_CONSUMERS
    inceptionYear = "2026"
    description = "HTML Canvas 2D / WebGL2-backed runtime implementations for Compose UI on the web"
    // Kotlin 2.4 API: the linear memory of Kotlin/Wasm (`kotlin.wasm.unsafe.wasmMemory`), through
    // which data reaches JS with a single copy.
    kotlinTarget = KotlinTarget.KOTLIN_2_4
}
